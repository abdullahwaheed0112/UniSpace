<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account · UniSpace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="site-header"></div>

    <main id="main">
        <div class="page-head">
            <h1>Create an account</h1>
            <p>Student accounts can request bookings. Administrator accounts are created by the system owner.</p>
        </div>

        <form id="signupForm" class="form" novalidate>
            <div class="field">
                <label for="username">Name</label>
                <input type="text" id="username" name="username" autocomplete="name" required>
                <span class="help">3 to 30 characters: letters, numbers, spaces, dots, dashes or underscores.</span>
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="new-password" required>
                <span class="help">At least 8 characters.</span>
            </div>
            <div id="message" class="notice" role="status" aria-live="polite"></div>
            <div class="row">
                <button type="submit" class="btn btn-primary">Create account</button>
                <span class="muted">Already registered? <a href="signin.html">Sign in</a></span>
            </div>
        </form>
    </main>

    <div id="site-footer"></div>
    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="ui.js"></script>
    <script src="nav.js"></script>
    <script src="auth.js"></script>
</body>
</html>
