<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Request a booking · UniSpace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="site-header"></div>

    <main id="main">
        <div class="page-head">
            <h1>Request a booking</h1>
            <p>Your request goes to an administrator for review. Nothing is reserved until it is approved, and you can cancel it until then.</p>
        </div>

        <form id="bookingForm" class="form" novalidate>
            <div class="field">
                <label for="resource">Resource</label>
                <select id="resource" required></select>
            </div>
            <div class="field">
                <label for="date">Date</label>
                <select id="date" required></select>
                <span class="help">Weekdays within the next seven days.</span>
            </div>
            <div class="field">
                <label for="timeSlot">Time slot</label>
                <select id="timeSlot" required></select>
                <span class="help" id="slot-help"></span>
            </div>
            <div id="message" class="notice" role="status" aria-live="polite"></div>
            <div class="row">
                <button type="submit" class="btn btn-primary" id="submit">Send request</button>
                <a class="btn" href="resources.html">Back to availability</a>
            </div>
        </form>
    </main>

    <div id="site-footer"></div>
    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="ui.js"></script>
    <script src="nav.js"></script>
    <script src="booking.js"></script>
</body>
</html>
