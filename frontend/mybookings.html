<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My bookings · UniSpace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="site-header"></div>

    <main id="main">
        <div class="page-head">
            <h1>My bookings</h1>
            <p>Where each request stands. Open a booking's history to see every step and who took it.</p>
        </div>

        <div id="message" class="notice" role="status" aria-live="polite" style="margin-bottom: 16px;"></div>

        <div class="stack">
            <section class="panel" aria-labelledby="open-title">
                <header><h2 id="open-title">Open requests and approved bookings</h2></header>
                <div id="open-list"><p class="empty">Loading…</p></div>
            </section>

            <section class="panel" aria-labelledby="closed-title">
                <header><h2 id="closed-title">Closed</h2><span class="muted">Rejected or cancelled</span></header>
                <div id="closed-list"><p class="empty">Loading…</p></div>
            </section>
        </div>
    </main>

    <div id="site-footer"></div>
    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="ui.js"></script>
    <script src="nav.js"></script>
    <script src="mybookings.js"></script>
</body>
</html>
