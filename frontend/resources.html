<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Availability · UniSpace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="site-header"></div>

    <main id="main">
        <div class="page-head">
            <h1>Availability</h1>
            <p>The next seven days, weekdays only. A slot marked Requested can still be requested: an administrator decides between competing requests.</p>
        </div>

        <div class="stack">
            <div class="row between">
                <div class="segmented" id="resource-picker" role="group" aria-label="Resource"></div>
                <div class="legend" aria-label="Legend">
                    <span><span class="cell cell-free">Free</span></span>
                    <span><span class="cell cell-requested">Requested</span></span>
                    <span><span class="cell cell-booked">Booked</span></span>
                    <span><span class="cell cell-blocked">Blocked</span></span>
                </div>
            </div>

            <section class="panel" aria-live="polite">
                <div class="table-wrap">
                    <table class="avail" id="grid">
                        <caption class="sr-only" id="grid-caption">Availability</caption>
                        <thead></thead>
                        <tbody><tr><td class="empty" colspan="6">Loading…</td></tr></tbody>
                    </table>
                </div>
            </section>
            <p class="muted" id="grid-hint"></p>
        </div>
    </main>

    <div id="site-footer"></div>
    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="ui.js"></script>
    <script src="nav.js"></script>
    <script src="resources.js"></script>
</body>
</html>
